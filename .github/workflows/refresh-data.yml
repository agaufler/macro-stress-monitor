name: Refresh Market Data

on:
  schedule:
    - cron: '0 12 * * *'   # Every day at 8am ET (12:00 UTC)
  workflow_dispatch:         # Also allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh market data
        run: python3 fetch_data.py

      - name: Copy data to deploy folder
        run: |
          mkdir -p deploy/data
          cp data/market_divergence.json deploy/data/market_divergence.json
          cp market-divergence-monitor.html deploy/index.html

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_divergence.json deploy/data/market_divergence.json deploy/index.html
          git diff --staged --quiet || git commit -m "Auto-refresh market data $(date -u +%Y-%m-%d)"
          git push
